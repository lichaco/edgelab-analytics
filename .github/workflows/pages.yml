name: Publicar EdgeLab en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Construir calendario desde fuentes públicas
        run: |
          python3 scripts/build_calendar.py
          python3 -m json.tool assets/data/calendar.json > /dev/null
      - name: Obtener cuotas públicas gratuitas de ESPN
        run: |
          python3 scripts/build_public_odds.py
          python3 -m json.tool assets/data/odds.json > /dev/null
      - name: Enriquecer player props con The Odds API (máximo 1 crédito por despliegue)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python3 scripts/build_the_odds_api.py
          python3 -m json.tool assets/data/odds.json > /dev/null
      - name: Recuperar caché interna DunkAPI (NO publicada en Pages)
        uses: actions/cache@v5
        with:
          path: |
            .edgelab-cache/dunkapi-private.json
            .edgelab-cache/nba-official-private.json
          key: ${{ runner.os }}-dunkapi-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dunkapi-v1-
      - name: Modelar NBA con DunkAPI (máximo 14 créditos por día de actualización)
        env:
          DUNKAPI_API_KEY: ${{ secrets.DUNKAPI_API_KEY }}
        run: |
          python3 scripts/build_dunkapi.py
          python3 -m json.tool assets/data/nba_predictions.json > /dev/null
      - name: Obtener box scores y estadísticas NBA oficiales (si accesibles)
        run: |
          python3 scripts/build_nba_official.py
          python3 -m json.tool assets/data/nba_official_predictions.json > /dev/null
      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Empaquetar página para GitHub Pages
        run: |
          tar --dereference --hard-dereference \
            --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
      - name: Subir paquete con Node.js 24
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5
