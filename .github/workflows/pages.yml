name: EdgeLab · publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar código
        run: |
          npm run check
          npm test
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
