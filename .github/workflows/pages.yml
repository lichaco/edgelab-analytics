name: Publicar EdgeLab en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Construir calendario desde fuentes públicas
        run: |
          python3 scripts/build_calendar.py
          python3 -m json.tool assets/data/calendar.json > /dev/null
      - name: Obtener cuotas prepartido y calcular correspondencias
        env:
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          python3 scripts/build_odds.py
          python3 -m json.tool assets/data/odds.json > /dev/null
      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Empaquetar página para GitHub Pages
        run: |
          tar --dereference --hard-dereference \
            --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
      - name: Subir paquete con Node.js 24
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5
