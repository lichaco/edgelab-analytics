name: Verificaciones EdgeLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: npm run check
      - name: Ejecutar pruebas JavaScript
        run: npm test
      - name: Verificar módulos de calendario
        run: |
          node --check assets/js/calendar.mjs
          node --check assets/js/fixtures.mjs
      - name: Validar sintaxis Python
        run: python3 -m py_compile scripts/build_calendar.py scripts/build_odds.py scripts/build_public_odds.py
      - name: Ejecutar pruebas de calendario y cuotas Python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
